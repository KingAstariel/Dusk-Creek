<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système de Gestion - In-Game & Database</title>
    <style>
        :root {
            --theme-red: #D91A2A;
            --theme-dark-red: #5c0b11;
            --theme-black: #0d0d0d;
            --theme-panel: #141414;
            --theme-gray: #242424;
            --theme-light-gray: #444444;
            --theme-text: #e0e0e0;
            --theme-yellow: #ffeb3b;
            --theme-green: #4CAF50;
            --theme-purple: #9C27B0;
            --theme-blue: #00bcd4;
        }

        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap');

        body {
            background-color: var(--theme-black);
            color: var(--theme-text);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }

        h1, h2, h3, .title-font {
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #000;
            padding: 10px;
            border-bottom: 3px solid var(--theme-red);
            margin-bottom: 15px;
            align-items: center;
        }

        .nav-tab {
            background: var(--theme-gray);
            color: var(--theme-text);
            border: none;
            padding: 10px 18px;
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transform: skewX(-8deg);
            transition: 0.15s ease-in-out;
        }

        .nav-tab:hover { background: var(--theme-light-gray); color: white; }
        .nav-tab.active { background: var(--theme-red); color: white; box-shadow: 3px 3px 0 var(--theme-text); }
        .nav-tab.mode-jeu { background: var(--theme-dark-red); border: 1px solid var(--theme-red); color: var(--theme-yellow); margin-left: 10px;}
        .nav-tab.mode-jeu.active { background: var(--theme-red); color: black; }

        .golden-box {
            display: flex; align-items: center; gap: 8px; 
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: black; padding: 6px 15px; 
            border: 2px solid #FFF8DC; 
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
            font-family: 'Anton', sans-serif; font-size: 1.2rem; 
            transform: skewX(-8deg);
            margin-left: auto; /* Pousse les éléments de droite */
        }

        .dusk-counter-box {
            display: flex; align-items: center; gap: 10px; background: #111; 
            padding: 6px 12px; border: 2px solid var(--theme-purple); transform: skewX(-8deg);
        }
        .dusk-counter-box button { background: var(--theme-gray); color: white; border: 1px solid #444; cursor: pointer; padding: 2px 8px; font-weight: bold; }
        .dusk-counter-box button:hover { background: var(--theme-red); }

        .layout { display: flex; gap: 15px; height: calc(100vh - 120px); }
        .sidebar { flex: 1; background: var(--theme-panel); border: 2px solid var(--theme-gray); padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .workspace { flex: 3; background: var(--theme-panel); border: 2px solid var(--theme-red); padding: 20px; overflow-y: auto; position: relative; }

        .item-card { background: var(--theme-gray); padding: 10px; cursor: pointer; font-weight: bold; border-left: 4px solid transparent; display: flex; justify-content: space-between; align-items: center; transform: skewX(-4deg); }
        .item-card:hover, .item-card.active { background: var(--theme-dark-red); border-left-color: var(--theme-red); }

        .folder-header { color: var(--theme-yellow); margin: 10px 0 5px 0; border-bottom: 1px solid #444; font-family: 'Anton', sans-serif; font-size: 1.1rem; }

        .btn { background: var(--theme-gray); color: white; border: 1px solid var(--theme-light-gray); padding: 8px 12px; cursor: pointer; font-family: 'Anton', sans-serif; text-transform: uppercase; }
        .btn:hover { background: var(--theme-light-gray); }
        .btn-add { background: var(--theme-red); border: none; font-size: 1rem;}
        .btn-add:hover { background: #ff1c2e; }
        .btn-danger { background: #b71c1c; border: none; color: white; font-size: 0.8rem; padding: 4px 8px;}
        .btn-danger:hover { background: #e53935; }

        .form-block { background: rgba(0,0,0,0.4); padding: 12px; margin-bottom: 12px; border: 1px dashed var(--theme-light-gray); }
        .form-block label { display: block; color: var(--theme-red); font-family: 'Anton', sans-serif; font-size: 0.95rem; margin-bottom: 4px; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; background: #000; color: white; border: 1px solid var(--theme-light-gray); padding: 8px; box-sizing: border-box; font-family: inherit; }
        input:focus, select:focus, textarea:focus { border-color: var(--theme-red); outline: none; }
        input[type="number"] { color: var(--theme-yellow); font-weight: bold; }
        .flex-grid { display: flex; gap: 10px; margin-bottom: 10px; }
        .col { flex: 1; }

        .ingame-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .ingame-box { background: #080808; border: 2px solid var(--theme-gray); padding: 15px; position: relative; }
        .ingame-box.accent { border-color: var(--theme-red); }
        .ingame-box h3 { background: var(--theme-red); color: white; padding: 4px 10px; margin:-15px -15px 15px -15px; font-size: 1.2rem; transform: skewX(-6deg); }
        
        .bar-container { background: #222; height: 16px; border: 1px solid #444; margin-top: 4px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.3s; }
        .bar-fill.hp { background: var(--theme-red); }
        .bar-fill.sp { background: var(--theme-green); }

        .game-stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a1a1a; }
        .game-stat-val { font-family: 'Anton', sans-serif; font-size: 1.3rem; color: var(--theme-yellow); }

        .icon-pv { color: var(--theme-red); font-weight: bold; }
        .icon-sm { color: var(--theme-green); font-weight: bold; }
        .icon-key { color: var(--theme-yellow); font-weight: bold; }
        .icon-xyz { color: var(--theme-purple); font-weight: bold; }

        .inventory-list { max-height: 250px; overflow-y: auto; background: #111; padding: 5px; border: 1px solid #333; }
        .inv-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #222; background: #0a0a0a; margin-bottom: 4px; }
        .inv-item button { padding: 4px 8px; font-size: 0.8rem; }

        .stats-exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #000; padding: 10px; margin-top: 10px; border: 1px solid #333; }
        .stats-exp-item { color: #ccc; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #222; padding-bottom: 4px; }
        .stat-direct-input { width: 50px !important; padding: 4px !important; margin-left: 8px; text-align: center; }

        .skill-card { background: #1a1a1a; border-left: 3px solid var(--theme-light-gray); padding: 10px; margin-bottom: 10px; font-size: 0.9rem; }
        .skill-card.mask-skill { border-left-color: var(--theme-purple); }
        .skill-card.hero-skill { border-left-color: var(--theme-red); }
        .skill-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .skill-title { font-family: 'Anton', sans-serif; font-size: 1.1rem; color: white; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px;}
        .skill-lvl-badge { background: #333; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; border: 1px solid #555; }
        .skill-dmg-dice { color: var(--theme-yellow); font-weight: bold; }
        .skill-type { color: #aaa; font-style: italic; font-size: 0.8rem; }
        .skill-effect { color: var(--theme-blue); margin-top: 4px; display: block; }
        .skill-mask-active { color: var(--theme-green); margin-top: 2px; display: block; font-weight: bold; }
        .skill-contrecoup { color: var(--theme-red); margin-top: 2px; display: block; }
        .skill-desc { color: #888; font-style: italic; margin-top: 6px; display: block; border-top: 1px dashed #333; padding-top: 4px; }
        .skill-exp-bar { background: #222; height: 4px; margin-top: 5px; overflow: hidden; }
        .skill-exp-fill { background: var(--theme-yellow); height: 100%; }

        .editor-array-item { background: #111; border: 1px solid #333; padding: 10px; margin-bottom: 10px; position: relative; }
        .editor-array-item input { margin-bottom: 5px; }
        .btn-remove-array { position: absolute; top: 10px; right: 10px; }

        .checkbox-label { background:#111; padding:6px 12px; border:1px solid #444; cursor:pointer; color:#ccc; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; transition: 0.2s; }
        .checkbox-label:hover { background: #222; border-color: var(--theme-red); }
        .checkbox-label input { width: auto; }

        #log-panel { position: fixed; bottom: 15px; right: 15px; background: var(--theme-red); color: white; padding: 10px 20px; font-family: 'Anton', sans-serif; transform: skewX(-10deg); display: none; z-index: 100; border: 2px solid white; box-shadow: 0 0 10px black; }
        #overlay-alert { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(4px); }
        .alert-box { background:var(--theme-dark-red); border:3px solid var(--theme-red); padding:40px; text-align:center; max-width:600px; transform: skewX(-2deg); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

<div id="login-overlay" style="display:none;position:fixed;inset:0;background:var(--theme-black);align-items:center;justify-content:center;z-index:500;">
  <div style="background:var(--theme-panel);border:1px solid var(--theme-red);border-radius:6px;padding:28px 30px;width:320px;max-width:90vw;">
    <h2 class="title-font" style="color:var(--theme-red);text-align:center;margin:0 0 6px;">Dusk Creek</h2>

    <input type="email" id="login-email" autocomplete="username" style="width:100%;padding:8px 9px;border-radius:4px;border:1px solid var(--theme-light-gray);background:#1a1a1a;color:var(--theme-text);box-sizing:border-box;">
    <label style="display:block;font-size:13px;color:#aaa;margin:10px 0 4px;">Mot de passe</label>
    <input type="password" id="login-password" autocomplete="current-password" style="width:100%;padding:8px 9px;border-radius:4px;border:1px solid var(--theme-light-gray);background:#1a1a1a;color:var(--theme-text);box-sizing:border-box;">
    <div id="login-error" style="color:#e07a7a;font-size:12.5px;margin-top:8px;min-height:16px;"></div>
    <button id="login-submit" class="btn" style="width:100%;margin-top:14px;border-color:var(--theme-red);">Se connecter</button>
  </div>
</div>


<div class="main-nav">
    <button class="nav-tab active" onclick="changeTab('heroes')">Héros</button>
    <button class="nav-tab" onclick="changeTab('masks')">Masques</button>
    <button class="nav-tab" onclick="changeTab('equipments')">Équipements</button>
    <button class="nav-tab" onclick="changeTab('passives')">Passifs & Magie</button>

    <button class="nav-tab" onclick="changeTab('notes')">Notes</button>

        💰 $<span id="total-money-display">0.00</span>

    <div class="dusk-counter-box">
        <span class="title-font" style="color:var(--theme-purple); font-size:0.9rem;">Essence Dusk Creek</span>
        <button onclick="changeDusk(-1)">-</button>

    <button class="nav-tab mode-jeu" onclick="changeTab('playmode')">⚔️ MODE JEU</button>
</div>

<div id="overlay-alert">
    <div class="alert-box">
        <h2 style="color:var(--theme-yellow); font-family:'Anton', sans-serif; font-size:2.5rem; margin-top:0;">⚠️ DUSK CREEK EN PÉRIL ⚠️</h2>
        <p id="overlay-alert-text" style="font-size:1.3rem; margin-bottom:30px; font-weight:bold;"></p>
        <button class="btn" style="font-size:1.2rem; padding: 10px 30px;" onclick="document.getElementById('overlay-alert').style.display='none'">Compris</button>
    </div>
</div>

<div class="layout" id="standard-layout">
    <div class="sidebar" id="sidebar-list"></div>
    <div class="workspace" id="editor-workspace"></div>
</div>

<div class="workspace" id="playmode-layout" style="display: none; border-color: var(--theme-red); height: calc(100vh - 120px);">
    <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px; background: #000; padding: 10px;">
        <span class="title-font" style="color: var(--theme-red); font-size: 1.2rem;">Héros Actif :</span>
        <select id="playmode-hero-select" onchange="selectPlaymodeHero(this.value)" style="width: auto; min-width: 200px; border-color: var(--theme-red);"></select>
    </div>
    <div class="ingame-dashboard" id="playmode-dashboard"></div>
</div>

<div class="workspace" id="system-layout" style="display: none; height: calc(100vh - 120px); text-align: center; padding-top: 100px;">
    <h2 style="color: var(--theme-red); font-size: 2rem;">Menu Système Fichiers</h2>
    <p style="color: #888;">Exportez ou importez l'intégralité de votre campagne (incluant vos notes).</p>
    <br><br>

    <div style="display: inline-block; background: var(--theme-gray); padding: 15px; border: 1px dashed var(--theme-red);">
        <label class="title-font" style="display: block; margin-bottom: 5px;">Charger un fichier de sauvegarde :</label>
        <input type="file" id="import-file-field" accept=".json" onchange="loadSystemData(event)">
    </div>
</div>

<div id="log-panel">Action Enregistrée</div>

    let firestoreDb = null;
    try{
      if(typeof firebase !== 'undefined' && firebaseConfig.apiKey){
        firebase.initializeApp(firebaseConfig);
        firestoreDb = firebase.firestore();
      }
    }catch(e){ console.error('Firebase init failed, falling back.', e); firestoreDb = null; }

    const firestoreAdapter = firestoreDb ? {
      async get(key){
        const snap = await firestoreDb.collection('kv').doc(key).get();
        if(!snap.exists) return null;
        return {key, value: snap.data().value};
      },
      async set(key, value){
        await firestoreDb.collection('kv').doc(key).set({value});
        return {key, value};
      }
    } : null;

    const hasArtifactStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
    const localAdapter = {
      async get(key){
        const v = localStorage.getItem(key);
        return v===null ? null : {key, value:v};
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return {key, value};
      }
    };
    const storage = firestoreAdapter || (hasArtifactStorage ? window.storage : localAdapter);

    let saveTimer = null;
    function scheduleSave(){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async ()=>{
        try{ await storage.set(STORAGE_KEY, JSON.stringify(db)); }
        catch(e){ console.error('Sauvegarde impossible', e); }

    function toggleHeroPassive(heroId, passiveId, isChecked) {
        let hero = db.heroes.find(h => h.id === heroId);
        if(!hero.passifsMagie) hero.passifsMagie = [];
        if(hero.maxAp === undefined) hero.maxAp = 5 + ((hero.niv || 1) - 1) * 2;

        if(isChecked) { 
            let usedAp = hero.passifsMagie.reduce((sum, pId) => {
                let p = db.passives.find(x => x.id === pId);
                return sum + (p ? (p.coutAp || 0) : 0);
            }, 0);
            let passiveToEquip = db.passives.find(p => p.id === passiveId);
            let cost = passiveToEquip ? (passiveToEquip.coutAp || 0) : 0;
            
            if (usedAp + cost > hero.maxAp) {
                triggerLog(`⚠️ AP Insuffisants pour l'équipement ! (Max: ${hero.maxAp})`);
                renderEditor();
                return;
            }
            if(!hero.passifsMagie.includes(passiveId)) hero.passifsMagie.push(passiveId); 
        } 
        else { 
            hero.passifsMagie = hero.passifsMagie.filter(id => id !== passiveId); 
        }
        renderEditor();
    }

    function updateEqStat(stat, val) {
        let item = db.equipments.find(x => x.id === selectedId);
        if(!item.stats) item.stats = {};
        item.stats[stat] = val;
    }

    function addStatExp(stat, sign, amountStr) {
        let amount = parseInt(amountStr) || 0;
        if (amount === 0) return;
        
        let hero = db.heroes.find(x => x.id === selectedId);
        if (!hero.expStats) hero.expStats = { force: 0, agilite: 0, investigation: 0, social: 0, dexterite: 0, intuition: 0 };
        hero.expStats[stat] = (hero.expStats[stat] || 0) + (amount * sign);
        
        while (hero.expStats[stat] >= 50) {
            hero.expStats[stat] -= 50;
            hero.statsHorsCombat[stat] = (Number(hero.statsHorsCombat[stat]) || 0) + 1;
            triggerLog(`${stat.toUpperCase()} a augmenté !`);
        }
        while (hero.expStats[stat] < 0) {
            if ((Number(hero.statsHorsCombat[stat]) || 0) > 0) {
                hero.expStats[stat] += 50;
                hero.statsHorsCombat[stat] = (Number(hero.statsHorsCombat[stat]) || 0) - 1;
                triggerLog(`Correction : point de ${stat.toUpperCase()} annulé.`);
            } else {
                hero.expStats[stat] = 0;
                break;
            }
        }
        renderEditor();
    }

    // Fonctions globales pour le mode Excel des notes
    window.updateExcelCell = function(id, r, c, val) {
        let note = db.notes.find(x => x.id === id);
        note.excelData[r][c] = val;
    }
    window.evalExcelCell = function(id, r, c, element) {
        let val = element.value;
        if(val.startsWith('=')) {
            let note = db.notes.find(x => x.id === id);
            let expression = val.substring(1).toUpperCase();
            
            expression = expression.replace(/([A-Z])([0-9]+)/g, function(match, colStr, rowStr) {
                let col = colStr.charCodeAt(0) - 65;
                let row = parseInt(rowStr) - 1; 
                if(note.excelData[row] && note.excelData[row][col]) {
                    let cellVal = note.excelData[row][col];
                    return (parseFloat(cellVal) || 0);
                }
                return 0;
            });

            try {
                let result = eval(expression);
                if (!Number.isInteger(result)) result = parseFloat(result.toFixed(2));
                element.value = result;
                note.excelData[r][c] = result;
            } catch(e) {
                element.value = "ERREUR";
            }
        }
    }
    window.addExcelRow = function(id) {
        let note = db.notes.find(x => x.id === id);
        let cols = note.excelData[0] ? note.excelData[0].length : 3;
        note.excelData.push(new Array(cols).fill(""));
        renderEditor();
    }
    window.addExcelCol = function(id) {
        let note = db.notes.find(x => x.id === id);
        note.excelData.forEach(row => row.push(""));
        renderEditor();
    }
    window.removeExcelRow = function(id, rIdx) {
        let note = db.notes.find(x => x.id === id);
        if(note.excelData.length > 1) {
            note.excelData.splice(rIdx, 1);
            renderEditor();
        }
    }
    window.removeExcelCol = function(id) {
        let note = db.notes.find(x => x.id === id);
        if(note.excelData[0] && note.excelData[0].length > 1) {
            note.excelData.forEach(row => row.pop());
            renderEditor();
        }
    }

    // Fonction spécifique pour modifier l'argent du héros de façon dynamique (Éditeur + Mode Jeu)
    window.modifyHeroMoney = function(id, sign, inputId) {
        let input = document.getElementById(inputId);
        let val = parseFloat(input.value.replace(',', '.')) || 0;
        if (val === 0) return;
        
        let hero = db.heroes.find(h => h.id === id);
        hero.argent = parseFloat(hero.argent || 0);
        hero.argent += val * sign;
        if (hero.argent < 0) hero.argent = 0; 
        hero.argent = parseFloat(hero.argent.toFixed(2));
        
        input.value = '';
        triggerLog(sign > 0 ? `Ajout de $${val.toFixed(2)} à ${hero.nom}` : `Retrait de $${val.toFixed(2)} à ${hero.nom}`);

    function updateField(key, val) {
        let item = db[activeTab].find(x => x.id === selectedId);
        let numFields = ['qty', 'bonusSocial', 'cout', 'coutAp', 'niv', 'maxHp', 'maxSp', 'maxAp', 'hp', 'sp', 'exp', 'argent'];
        if (numFields.includes(key)) {
            item[key] = Number(String(val).replace(',', '.'));
        } else {
            item[key] = val;
            if (key === 'power' && !isNaN(val) && val.trim() !== '') item[key] = Number(val);
        }
        if(key === 'nom' || key === 'type' || key === 'folder' || key === 'ownerId') renderSidebar();
    }
    
    function updateNestedField(p, c, v) { db[activeTab].find(x => x.id === selectedId)[p][c] = Number(v); }
    function updateEquipment(s, eqId) { db.heroes.find(x => x.id === selectedId).equipement[s] = eqId; }
    function generateEqOptions(s, curr) { return `<option value="">-- Vide --</option>` + db.equipments.filter(e => e.type === s).map(e => `<option value="${e.id}" ${curr===e.id?'selected':''}>${e.nom}</option>`).join(''); }
    function generateMaskOptions(curr) { return `<option value="">-- Aucun --</option>` + db.masks.map(m => `<option value="${m.id}" ${curr===m.id?'selected':''}>${m.nom}</option>`).join(''); }

    function applyBonus(base, val) {
        let b = Number(base) || 0;
        if(!val) return b;
        let str = String(val).trim();
        let num = parseFloat(str);
        if(isNaN(num)) return b;
        if(str.endsWith('%')) return b + Math.floor(b * (num / 100));
        return b + num;
    }

    function getInitials(passiveId) {
        let owners = db.heroes.filter(h => 
            (h.passifsMagie && h.passifsMagie.includes(passiveId)) || 
            (h.equipement && [h.equipement.arme, h.equipement.veste, h.equipement.soulier, h.equipement.accessoire].some(eqId => {
                let eq = db.equipments.find(e => e.id === eqId);
                return eq && eq.passifLie === passiveId;
            }))
        );
        if (owners.length === 0) return "";
        return " [" + owners.map(o => o.nom.split(' ').map(n=>n[0]).join('')).join(', ') + "]";
    }

    function formatEqStats(eq) {
        if(!eq || !eq.stats) return "Aucun effet";
        let parts = [];
        for(let k in eq.stats) {
            if(eq.stats[k]) {
                let label = k.charAt(0).toUpperCase() + k.slice(1);
                if(k === 'forceCombat') label = "Force Cbt";
                if(k === 'esquive') label = "Esquive Cbt";
                parts.push(`${label}: +${eq.stats[k]}`);
            }
        }
        if(eq.passifLie) {
            let p = db.passives.find(x=>x.id===eq.passifLie);
            if(p) parts.push(`Lien: ${p.nom}`);
        }
        return parts.length ? parts.join(' | ') : "Pas de stats";
    }

    function injectHeroExp(heroId) {
        let amount = Number(document.getElementById('custom-hero-exp').value) || 0;
        let hero = db.heroes.find(x => x.id === heroId);
        hero.exp += amount;
        while(hero.exp >= getExpReq(hero.niv)) { 
            hero.exp -= getExpReq(hero.niv); 
            hero.niv += 1; 
            hero.maxHp += 15; 
            hero.maxSp += 8; 
            if(hero.maxAp === undefined) hero.maxAp = 5 + (hero.niv - 2) * 2;
            hero.maxAp += 2;
            triggerLog(`LEVEL UP ! ${hero.nom} passe niv ${hero.niv}`); 
        }
        renderEditor();
    }
    function injectMaskExp(maskId) {
        let amount = Number(document.getElementById('custom-mask-exp').value) || 0;
        let mask = db.masks.find(x => x.id === maskId);
        injectMaskExpSystem(mask, amount);
        renderEditor();
    }

    function injectMaskExpSystem(mask, amount) {
        mask.exp += amount;
        while(mask.exp >= getExpReq(mask.niv)) { 
            mask.exp -= getExpReq(mask.niv); 
            mask.niv++; 
            mask.statsCombat.forceCombat += 2; 
            mask.statsCombat.defense += 1; 
            triggerLog(`LEVEL UP Masque : ${mask.nom} passe niv ${mask.niv}`); 
        }
    }

    function gainSkillExp(skill, amount) {
        if(skill.niv === undefined) skill.niv = 1;
        if(skill.exp === undefined) skill.exp = 0;
        if(skill.niv >= 3) return; 
        
        skill.exp += amount;
        let req = getSkillExpReq(skill.niv);
        while(skill.exp >= req && skill.niv < 3) {
            skill.exp -= req;
            skill.niv++;
            req = getSkillExpReq(skill.niv);
            triggerLog(`COMPÉTENCE AMÉLIORÉE ! ${skill.nom} passe Niv ${skill.niv}`);
        }
        if(skill.niv >= 3) skill.exp = 0;
    }

    function populatePlaymodeHeroSelect() {
        const select = document.getElementById('playmode-hero-select');
        select.innerHTML = db.heroes.map(h => `<option value="${h.id}">${h.nom}</option>`).join('');
    }

    function selectPlaymodeHero() { 
        activeFragId = null; 
        renderPlaymode(); 
    }
    
    function renderPlaymode() {
        const hId = document.getElementById('playmode-hero-select').value;
        const dashboard = document.getElementById('playmode-dashboard');
        if(!hId) return;

        const hero = db.heroes.find(h => h.id === hId);
        const mask = db.masks.find(m => m.id === hero.masqueActif);
        const arme = db.equipments.find(e => e.id === hero.equipement.arme) || { nom: "Aucune", stats: {} };
        const veste = db.equipments.find(e => e.id === hero.equipement.veste) || { nom: "Aucune", stats: {} };
        const soulier = db.equipments.find(e => e.id === hero.equipement.soulier) || { nom: "Aucun", stats: {} };
        const acc = db.equipments.find(e => e.id === hero.equipement.accessoire) || { nom: "Aucun", stats: {} };

        let eqs = [arme, veste, soulier, acc];
        let eqPassives = eqs.map(e => e.passifLie).filter(Boolean);

        let finalMaxHp = Number(hero.maxHp) || 0;
        let finalMaxSp = Number(hero.maxSp) || 0;
        let finalMaxAp = hero.maxAp !== undefined ? hero.maxAp : 5 + ((hero.niv||1)-1)*2;
        let finalForce = Number(hero.statsHorsCombat.force || 0);
        let finalAgi = Number(hero.statsHorsCombat.agilite || 0);
        let finalInv = Number(hero.statsHorsCombat.investigation || 0);
        let finalSoc = Number(hero.statsHorsCombat.social || 0) + (mask ? Number(mask.bonusSocial || 0) : 0);
        let finalDex = Number(hero.statsHorsCombat.dexterite || 0);
        let finalInt = Number(hero.statsHorsCombat.intuition || 0);

        let maskForce = mask ? Number(mask.statsCombat.forceCombat || 0) : 0;
        let maskDef = mask ? Number(mask.statsCombat.defense || 0) : 0;
        let maskEsq = mask ? Number(mask.statsCombat.esquive || 0) : 0;
        
        let usedAp = (hero.passifsMagie || []).reduce((sum, pId) => {
            let p = db.passives.find(x => x.id === pId);
            return sum + (p ? (p.coutAp || 0) : 0);
        }, 0);

        eqs.forEach(eq => {
            if(!eq.stats) return;
            finalMaxHp = applyBonus(finalMaxHp, eq.stats.pv);
            finalMaxSp = applyBonus(finalMaxSp, eq.stats.sm);
            finalForce = applyBonus(finalForce, eq.stats.force);
            finalAgi = applyBonus(finalAgi, eq.stats.agilite);
            finalInv = applyBonus(finalInv, eq.stats.investigation);
            finalSoc = applyBonus(finalSoc, eq.stats.social);
            finalDex = applyBonus(finalDex, eq.stats.dexterite);
            finalInt = applyBonus(finalInt, eq.stats.intuition);
            
            maskForce = applyBonus(maskForce, eq.stats.forceCombat);
            maskDef = applyBonus(maskDef, eq.stats.defense);
            maskEsq = applyBonus(maskEsq, eq.stats.esquive);
        });

        let totalForceCombat = finalForce + maskForce;
        let totalEsquive = finalAgi + maskEsq;

            let maxN = n >= 3;
            let req = maxN ? "MAX" : getSkillExpReq(n);

                        actionBtn = `<button class="btn btn-danger" style="padding:4px 8px; font-size:0.8rem; margin-top:5px; width:100%; font-weight:bold;" onclick="useMagic('${hero.id}', '${p.id}', true)">Forcer Sort (Tomber à 0 SM !)</button>`;
                    }

                return `
                    <div class="skill-card" style="border-left-color: ${borderColor};">
                        <div class="skill-header">
                            <span class="skill-title">${p.type === 'Passif' ? '🧿' : '✨'} ${p.nom} <span style="color:#888; font-size:0.85rem;">${initials}</span></span>

            }).join('');
        } else {

        }

        dashboard.innerHTML = `

                <div style="margin-bottom:12px;">
                    <div style="display:flex; justify-content:space-between; width:100%;">

                <div style="margin-bottom:12px;">

                    <input type="number" id="vital-input-${hero.id}" value="10" style="width:60px; text-align:center; padding:5px; background:#000; color:white; border:1px solid #444;">
                    <div style="display:flex; gap: 5px;">
                        <button class="btn" onclick="adjustVitalDynamic('${hero.id}', 'hp', -1, ${finalMaxHp})" style="color: #ff5252;">- PV</button>
                        <button class="btn" onclick="adjustVitalDynamic('${hero.id}', 'hp', 1, ${finalMaxHp})" style="color: #ff5252;">+ PV</button>

                        <button class="btn" onclick="adjustVitalDynamic('${hero.id}', 'sp', 1, ${finalMaxSp})" style="color: #69f0ae;">+ SM</button>

                <div class="game-stat-row"><span>Investigation</span><span class="game-stat-val">${finalInv}</span></div>
                <div class="game-stat-row"><span>Social</span><span class="game-stat-val" style="color:cyan;">${finalSoc}</span></div>

                ${mask ? `
                <div class="flex-grid" style="margin-bottom:10px;">
                    <div class="col" style="background:#111; padding:5px; text-align:center;">

                        <strong style="color:var(--theme-yellow); font-size:1.2rem;">${totalForceCombat}</strong>

                    </div>

                        <span style="font-size:0.8rem; color:#aaa; display:block;">Défense</span>

    function applyFragment(itemId) {
        let item = db.items.find(i => i.id === itemId);
        let targetVal = document.getElementById(`frag-target-${itemId}`).value;
        let hero = db.heroes.find(h => h.id === document.getElementById('playmode-hero-select').value);
        let mask = db.masks.find(m => m.id === hero.masqueActif);
        
        let amount = parseInt(item.power) || 0;
        let [type, indexId] = targetVal.split('|');

        if(type === 'mask') {
            let numTargets = 1 + (mask.competences ? mask.competences.length : 0);
            let share = Math.floor(amount / numTargets);
            injectMaskExpSystem(mask, share);
            if(mask.competences) {
                mask.competences.forEach(c => gainSkillExp(c, share));
            }
            triggerLog(`Fragment utilisé: +${share} EXP au Masque et à tous ses sorts !`);
        } else if (type === 'atk') {
            let atk = hero.attaques[parseInt(indexId)];
            gainSkillExp(atk, amount);
            triggerLog(`Fragment utilisé: +${amount} EXP à ${atk.nom} !`);
        } else if (type === 'mag') {
            let mag = mask.competences[parseInt(indexId)];
            gainSkillExp(mag, amount);
            triggerLog(`Fragment utilisé: +${amount} EXP à ${mag.nom} !`);
        }

        item.qty--;
        activeFragId = null;
        renderPlaymode();
    }

    function useItem(itemId) {
        let item = db.items.find(i => i.id === itemId);
        if(item.type !== 'key' && item.qty <= 0) return;

        let activeHeroId = document.getElementById('playmode-hero-select').value;
        let activeHero = db.heroes.find(h => h.id === activeHeroId);
        let amount = parseFloat(item.power) || 0;
        let logMsg = `Utilisation de ${item.nom} : `;

        if(item.type === 'pv' || item.type === 'sm') {
            let prop = item.type === 'pv' ? 'hp' : 'sp';
            let maxProp = item.type === 'pv' ? 'maxHp' : 'maxSp';
            if(item.target === 'group') {
                db.heroes.forEach(h => h[prop] = Math.min(h[maxProp], h[prop] + amount));
                logMsg += `+${amount} ${item.type.toUpperCase()} pour tout le groupe.`;
            } else if (item.target === 'single') {
                activeHero[prop] = Math.min(activeHero[maxProp], activeHero[prop] + amount);
                logMsg += `+${amount} ${item.type.toUpperCase()} pour ${activeHero.nom}.`;
            }
        } else if (item.type === 'xyz') { logMsg += `Effet appliqué : ${item.power}`; }
        else if (item.type === 'key') { logMsg = `Objet Clé inspecté : ${item.nom}`; }

        if(item.type !== 'key') { item.qty -= 1; }
        triggerLog(logMsg);
        renderPlaymode();
    }

    function useMagic(heroId, magicId, isForced = false) {
        let hero = db.heroes.find(h => h.id === heroId);
        let magic = db.passives.find(p => p.id === magicId);
        
        let cost = parseInt(magic.cout) || 0;
        hero.sp = Math.max(0, hero.sp - cost);

        let amount = parseFloat(magic.power) || 0;
        let logMsg = `${hero.nom} lance ${magic.nom}${isForced ? " EN FORÇANT (SM à 0)" : ""} : `;

        if(magic.actionType === 'pv' || magic.actionType === 'sm') {
            let prop = magic.actionType === 'pv' ? 'hp' : 'sp';
            let maxProp = magic.actionType === 'pv' ? 'maxHp' : 'maxSp';
            if(magic.target === 'group') {
                db.heroes.forEach(h => h[prop] = Math.min(h[maxProp], h[prop] + amount));
                logMsg += `+${amount} ${magic.actionType.toUpperCase()} (Groupe).`;
            } else {
                hero[prop] = Math.min(hero[maxProp], hero[prop] + amount);
                logMsg += `+${amount} ${magic.actionType.toUpperCase()} (${hero.nom}).`;
            }
        } else if (magic.actionType === 'xyz') {
            logMsg += `Guérit : ${magic.power}`;
        } else if (magic.actionType === 'revive') {
            logMsg += `Résurrection !`;
            if(magic.target === 'group') {
                db.heroes.forEach(h => { if(h.hp === 0) h.hp = amount || 1; });
            } else {
                if(hero.hp === 0) hero.hp = amount || 1;
            }
        }

        triggerLog(logMsg);
        changeDusk(-1); 
        renderPlaymode();
    }

    function adjustVitalDynamic(heroId, type, multiplier, computedMax = null) {
        let amount = parseInt(document.getElementById(`vital-input-${heroId}`).value) || 0;
        let hero = db.heroes.find(h => h.id === heroId);
        let max = computedMax || (type === 'hp' ? hero.maxHp : hero.maxSp);
        if(type === 'hp') hero.hp = Math.min(max, Math.max(0, hero.hp + (amount * multiplier)));
        else hero.sp = Math.min(max, Math.max(0, hero.sp + (amount * multiplier)));
        renderPlaymode();
    }

    function triggerLog(msg) {
        let log = document.getElementById('log-panel');
        log.innerText = msg;
        log.style.display = 'block';
        setTimeout(() => { log.style.display = 'none'; }, 4000);
    }

    function saveSystemData() {
        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 4));
        let dlNode = document.createElement('a'); dlNode.setAttribute("href", dataStr); dlNode.setAttribute("download", "Campagne_Save.json"); document.body.appendChild(dlNode); dlNode.click(); dlNode.remove();
        triggerLog("Fichier Téléchargé");
    }

    function saveSystemDataSophie() {
        let jsonStr = JSON.stringify(db, null, 4);
        let blob = new Blob([jsonStr], { type: "application/json" });
        let url = URL.createObjectURL(blob);
        let dlNode = document.createElement('a'); 
        dlNode.setAttribute("href", url); 
        dlNode.setAttribute("download", "Campagne_Save.json"); 
        document.body.appendChild(dlNode); 
        dlNode.click(); 
        dlNode.remove(); 
        URL.revokeObjectURL(url);
        triggerLog("Fichier Téléchargé (iPad)");

    function applyMigrations(parsed){
        if(!(parsed && parsed.heroes && parsed.items)) return null;
        parsed.items = parsed.items.filter(i => i.type !== 'money');
        if(!parsed.systemState) parsed.systemState = { duskCounter: 10, duskMax: 10 };
        if(!parsed.notes) parsed.notes = [];
        parsed.heroes.forEach(h => {
            if(h.argent === undefined) h.argent = 0;
            if(h.maxAp === undefined) h.maxAp = 5 + ((h.niv || 1) - 1) * 2;
            h.attaques && h.attaques.forEach(a => { if(!a.niv) a.niv=1; if(!a.exp) a.exp=0; })
            if(!h.expStats) h.expStats = { force: 0, agilite: 0, investigation: 0, social: 0, dexterite: 0, intuition: 0 };
        });
        // Sécurité pour les anciens fichiers : assigner les objets au premier héros si aucun propriétaire n'est défini
        parsed.items.forEach(i => {
            if (!i.ownerId && parsed.heroes.length > 0) i.ownerId = parsed.heroes[0].id;
        });
        parsed.masks.forEach(m => m.competences && m.competences.forEach(c => { if(!c.niv) c.niv=1; if(!c.exp) c.exp=0; }));
        parsed.passives.forEach(p => {
            if(p.coutAp === undefined) p.coutAp = 0;
        });
        parsed.equipments.forEach(eq => { if(!eq.stats) eq.stats = {}; });
        return parsed;
    }

    function loadSystemData(e) {
        let file = e.target.files[0];
        if(!file) return;
        let reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let parsed = JSON.parse(evt.target.result);
                const migrated = applyMigrations(parsed);
                if(migrated){
                    db = migrated;
                    triggerLog("Données synchronisées !");
                    updateTopBar();
                    changeTab('playmode');
                    scheduleSave();
                }
            } catch(err) { triggerLog("Erreur de chargement."); }
        };
        reader.readAsText(file);
    }

    async function loadFromCloud(){
        try{
            const res = await storage.get(STORAGE_KEY);
            if(res && res.value){
                const parsed = JSON.parse(res.value);
                const migrated = applyMigrations(parsed);
                if(migrated){ db = migrated; return true; }
            }
        }catch(e){ console.error('Chargement impossible', e); }
        return false;
    }

    async function boot(){
        await loadFromCloud();
        updateTopBar();
        renderSidebar(); renderEditor();
    }

    ['updateTopBar','renderSidebar','renderEditor','renderPlaymode'].forEach(fnName=>{
        const original = window[fnName];
        if(typeof original === 'function'){
            window[fnName] = function(...args){
                const result = original.apply(this, args);
                scheduleSave();
                return result;
            };
        }
    });

    function startApp(){
        if(firestoreDb && typeof firebase.auth === 'function'){
            const loginOverlay = document.getElementById('login-overlay');
            let started = false;
            firebase.auth().onAuthStateChanged(user=>{
                if(user){
                    loginOverlay.style.display = 'none';
                    if(!started){ started = true; boot(); }
                } else {
                    loginOverlay.style.display = 'flex';
                }
            });
            document.getElementById('login-submit').addEventListener('click', doLogin);
            document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
            document.getElementById('login-email').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
            function doLogin(){
                const email = document.getElementById('login-email').value.trim();
                const pw = document.getElementById('login-password').value;
                const errEl = document.getElementById('login-error');
                errEl.textContent = '';
                if(!email || !pw){ errEl.textContent = 'Courriel et mot de passe requis.'; return; }
                firebase.auth().signInWithEmailAndPassword(email, pw).catch(err=>{
                    errEl.textContent = 'Connexion refusée : courriel ou mot de passe incorrect.';
                });
            }
        } else {
            boot();
        }
    }
    startApp();
</script>

</body>
</html>
